<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h2>Tic Tac Toe</h2>
<div id="players">
    <div class="player" data-player="1">Player 1 = 0</div>
    <div class="player" data-player="2">Player 2 = 0</div>
</div>
<div id="board">
    <div class="cell"  data-row="0" data-col="0" onclick="playerTurnSwitch(this);checkWinner()"></div>
    <div class="cell"  data-row="0" data-col="1" onclick="playerTurnSwitch(this);checkWinner()"></div>
    <div class="cell"  data-row="0" data-col="2" onclick="playerTurnSwitch(this);checkWinner()"></div>
    <div class="cell"  data-row="1" data-col="0" onclick="playerTurnSwitch(this);checkWinner()"></div>
    <div class="cell"  data-row="1" data-col="1" onclick="playerTurnSwitch(this);checkWinner()"></div>
    <div class="cell"  data-row="1" data-col="2" onclick="playerTurnSwitch(this);checkWinner()"></div>
    <div class="cell"  data-row="2" data-col="0" onclick="playerTurnSwitch(this);checkWinner()"></div>
    <div class="cell"  data-row="2" data-col="1" onclick="playerTurnSwitch(this);checkWinner()"></div>
    <div class="cell"  data-row="2" data-col="2" onclick="playerTurnSwitch(this);checkWinner()"></div>
</div>
<script src="script.js"></script>
</body>
</html>
